# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release', name: "macOS latest"}
          - {os: windows-latest, r: 'release', name: "Windows latest"}
          - {os: ubuntu-latest,   r: 'release', custom: 'clang-format'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', name: "Ubuntu latest (R devel)"}
          - {os: ubuntu-latest,   r: 'release', custom: 'no-armadillo4rtest', name: "Ubuntu latest (no armadillo4rtest)"}
          - {os: ubuntu-latest,   r: 'release', custom: 'cpp15', name: "Ubuntu latest (GCC15)"} # CRAN email Dec 7, 2024

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: pachadotdev/clang-format@main
        if: matrix.config.custom == 'clang-format'
        with:
          version: '18'
          files: 'inst/include/armadillo4r.hpp inst/include/armadillo4r/wrappers/*.hpp'
          auto-commit: true
          commit-message: 'style: format C++ code in R package'

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
        
      - name: Install armadillo4rtest
        if: matrix.config.custom != 'no-armadillo4rtest'
        run: |
          options(warn = 2)
          pak::local_install_dev_deps("armadillo4rtest", dependencies = TRUE)
          install.packages(".", repos = NULL, type = "source")
          install.packages("armadillo4rtest", repos = NULL, INSTALL_opts = "--install-tests", type = "source")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Run armadillo4rtest tests
        if: matrix.config.custom != 'no-armadillo4rtest' && matrix.config.custom != 'cpp15'
        run: |
          setwd("armadillo4rtest/tests")
          library(testthat)
          library(armadillo4rtest)
          test_check("armadillo4rtest", reporter = "progress")
        shell: Rscript {0}

      - name: Run armadillo4rtest tests (C++15)
        if: matrix.config.custom == 'cpp15'
        run: |
          Sys.setenv(CXXFLAGS = "-std=c++15")
          install.packages(".", repos = NULL, type = "source")
          install.packages("armadillo4rtest", repos = NULL, INSTALL_opts = "--install-tests", type = "source")
          setwd("armadillo4rtest/tests")
          library(testthat)
          library(armadillo4rtest)
          test_check("armadillo4rtest", reporter = "progress")
        shell: Rscript {0}
        